<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101f38"/>
      <stop offset="1" stop-color="#294a7e"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a90e2"/>
      <stop offset="1" stop-color="#3577c6"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="560" fill="url(#bg)"/>

  <!-- Subtle grid backdrop -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="140" x2="1400" y2="140"/>
    <line x1="0" y1="280" x2="1400" y2="280"/>
    <line x1="0" y1="420" x2="1400" y2="420"/>
    <line x1="350" y1="0" x2="350" y2="560"/>
    <line x1="700" y1="0" x2="700" y2="560"/>
    <line x1="1050" y1="0" x2="1050" y2="560"/>
  </g>

  <!-- Icon left -->
  <g transform="translate(80, 140)">
    <rect x="0" y="0" width="280" height="280" rx="56" ry="56" fill="#1e3a5f"/>
    <rect x="36" y="70" width="208" height="140" rx="24" ry="24" fill="#4a90e2"/>
    <polygon points="106,210 144,210 120,260" fill="#4a90e2"/>
    <text x="140" y="150" text-anchor="middle" dominant-baseline="central"
          font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="96" fill="#ffffff">TC</text>
  </g>

  <!-- Title block -->
  <text x="410" y="240" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="76" fill="#ffffff">OpenFront Chat</text>
  <text x="410" y="292" font-family="Helvetica, Arial, sans-serif" font-weight="500" font-size="26" fill="#ffd28a">Community · Beta</text>
  <text x="410" y="352" font-family="Helvetica, Arial, sans-serif" font-weight="400" font-size="26" fill="#c8d4e6">
    Chat with other openfront.io players — in the lobby, in FFA, or with your team.
  </text>

  <!-- Chips: modes -->
  <g font-family="Helvetica, Arial, sans-serif" font-weight="600" font-size="20" fill="#ffffff">
    <g transform="translate(410, 400)">
      <rect x="0" y="0" width="140" height="46" rx="23" fill="url(#chip)"/>
      <text x="70" y="30" text-anchor="middle">Lobby</text>
    </g>
    <g transform="translate(566, 400)">
      <rect x="0" y="0" width="140" height="46" rx="23" fill="url(#chip)"/>
      <text x="70" y="30" text-anchor="middle">FFA</text>
    </g>
    <g transform="translate(722, 400)">
      <rect x="0" y="0" width="140" height="46" rx="23" fill="url(#chip)"/>
      <text x="70" y="30" text-anchor="middle">Team</text>
    </g>
  </g>
</svg>
