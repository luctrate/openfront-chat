<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 440 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132542"/>
      <stop offset="1" stop-color="#25406b"/>
    </linearGradient>
  </defs>
  <rect width="440" height="280" fill="url(#bg)"/>

  <!-- Icon (reuses the extension icon design inline so we don't depend on the PNG file) -->
  <g transform="translate(20, 60)">
    <rect x="0" y="0" width="160" height="160" rx="32" ry="32" fill="#1e3a5f"/>
    <rect x="20" y="40" width="120" height="80" rx="14" ry="14" fill="#4a90e2"/>
    <polygon points="60,120 82,120 68,146" fill="#4a90e2"/>
    <text x="80" y="86" text-anchor="middle" dominant-baseline="central"
          font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="56" fill="#ffffff">TC</text>
  </g>

  <!-- Title + tagline -->
  <text x="200" y="112" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="32" fill="#ffffff">OpenFront</text>
  <text x="200" y="148" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="32" fill="#ffffff">Chat</text>
  <text x="200" y="180" font-family="Helvetica, Arial, sans-serif" font-weight="500" font-size="14" fill="#ffd28a">Community · Beta</text>
  <text x="200" y="212" font-family="Helvetica, Arial, sans-serif" font-weight="400" font-size="13" fill="#c8d4e6">Lobby · FFA · Team</text>
</svg>
