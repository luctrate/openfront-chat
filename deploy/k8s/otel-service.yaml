# In-cluster Service in front of the otel-collector DaemonSet so other pods
# can push OTLP without hard-coding pod IPs.
#   OTLP HTTP endpoint (what the relay uses): http://otel-collector.otel.svc.cluster.local:4318
#   OTLP gRPC endpoint:                       otel-collector.otel.svc.cluster.local:4317
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: otel
  labels:
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/instance: otel-collector
    app.kubernetes.io/managed-by: openfront-chat
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/instance: otel-collector
    component: agent-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
