<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>OpenFront Chat (Community)</title>
  <style>
    body { font: 13px/1.4 system-ui, -apple-system, sans-serif; width: 280px; padding: 12px; margin: 0; color: #222; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .row { margin-top: 8px; }
    .k { font-weight: 600; font-size: 12px; color: #444; }
    .v { font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all; }
    .note { background: #f6f6f6; border-left: 3px solid #4a90e2; padding: 6px 8px; font-size: 11px; margin-top: 10px; color: #444; }
  </style>
</head>
<body>
  <h1>OpenFront Chat (Community)</h1>
  <div class="row"><span class="k">Relay:</span> <span class="v" id="wsUrl">—</span></div>
  <div class="row"><span class="k">Secret:</span> <span class="v" id="secretMask">—</span></div>
  <div class="note">
    Nickname and team are auto-detected from OpenFront. Global Chat is available on the main page; Team Chat in team games; Game Chat in FFA/multiplayer. Disabled in single-player.
  </div>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
