<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Rounded-square background -->
  <rect x="20" y="20" width="472" height="472" rx="96" ry="96" fill="#1e3a5f"/>

  <!-- Chat bubble body -->
  <rect x="80" y="130" width="352" height="230" rx="40" ry="40" fill="#4a90e2"/>

  <!-- Bubble tail -->
  <polygon points="200,360 260,360 220,432" fill="#4a90e2"/>

  <!-- "TC" text, centered inside bubble -->
  <text x="256" y="250"
        font-family="Helvetica, Arial, sans-serif"
        font-weight="700" font-size="180"
        fill="#ffffff" text-anchor="middle"
        dominant-baseline="central">TC</text>
</svg>
